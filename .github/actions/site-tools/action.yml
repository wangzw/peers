name: Site tools
description: Install Hugo at the Makefile's HUGO_VERSION and lychee, each verified against its published checksum.

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      run: |
        # make site-check requires the Hugo version the Makefile names, so the Makefile stays its source.
        version="$(sed -n 's/^HUGO_VERSION[[:space:]]*[:?]=[[:space:]]*//p' Makefile)"
        base="https://github.com/gohugoio/hugo/releases/download/v${version}"
        curl -sSL -o "$RUNNER_TEMP/hugo_checksums.txt" "${base}/hugo_${version}_checksums.txt"
        checksum="$(grep " hugo_${version}_linux-amd64.tar.gz$" "$RUNNER_TEMP/hugo_checksums.txt" | awk '{print $1}')"
        test -n "$checksum"
        curl -sSL -o "$RUNNER_TEMP/hugo.tar.gz" "${base}/hugo_${version}_linux-amd64.tar.gz"
        printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/hugo.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP" hugo
        sudo install -m 0755 "$RUNNER_TEMP/hugo" /usr/local/bin/hugo
        hugo version
    - name: Install lychee
      shell: bash
      run: |
        version="0.24.2"
        archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
        base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${version}"
        curl -sSL -o "$RUNNER_TEMP/${archive}" "${base}/${archive}"
        curl -sSL -o "$RUNNER_TEMP/${archive}.sha256" "${base}/${archive}.sha256"
        checksum="$(awk '{print $1}' "$RUNNER_TEMP/${archive}.sha256")"
        printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/${archive}" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu/lychee" /usr/local/bin/lychee
        lychee --version
