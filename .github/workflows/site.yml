name: Site

on:
  push:
    branches:
      - main
    paths:
      - docs/site/**
      - docs/assets/**
      - scripts/site-meta/**
      - scripts/site-parity/**
      - scripts/site-release-number/**
      - scripts/site-versions/**
      - scripts/site-baseurl-check.sh
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/site.yml
  pull_request:
    paths:
      - docs/site/**
      - docs/assets/**
      - scripts/site-meta/**
      - scripts/site-parity/**
      - scripts/site-release-number/**
      - scripts/site-versions/**
      - scripts/site-baseurl-check.sh
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/site.yml
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  LYCHEE_VERSION: 0.24.2

# Every run on main that may deploy shares the deployment group, so two such
# runs cannot build and then deploy out of order: a push, a manual dispatch and
# a workflow_run whose Release run succeeded. A pull request, a run on another
# branch and a workflow_run whose Release run did not succeed use their own
# group, so a failed Release never queues in pages and cancels the deploy it was
# checked against. This is the run's only group: a queued run is a whole run, so
# it lists the released versions after any run it replaced.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'pages' || format('site-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    # The deploy job needs this one, so a failed Release run skips the deploy here.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # enableGitInfo dates every page by its last commit; a shallow
          # clone would give every page the date of the newest one.
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: docs/site/go.mod
          # The generated website carries the install commands, and its build
          # feeds the published page, so it must not restore a cache another
          # workflow can write.
          cache: false
      - name: Install Hugo
        run: |
          version="$(sed -n 's/^HUGO_VERSION[[:space:]]*[:?]=[[:space:]]*//p' Makefile)"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl -sSL -o /tmp/hugo_checksums.txt "${base}/hugo_${version}_checksums.txt"
          checksum="$(grep " hugo_${version}_linux-amd64.tar.gz$" /tmp/hugo_checksums.txt | awk '{print $1}')"
          test -n "$checksum"
          curl -sSL -o /tmp/hugo.tar.gz "${base}/hugo_${version}_linux-amd64.tar.gz"
          printf '%s  %s\n' "$checksum" /tmp/hugo.tar.gz | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Install lychee
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -sSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSL -o "/tmp/${archive}.sha256" "${base}/${archive}.sha256"
          checksum="$(awk '{print $1}' "/tmp/${archive}.sha256")"
          printf '%s  %s\n' "$checksum" "/tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version
      - name: Check the site
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: make site-check
      # The token stays on this step, which only lists releases. The steps that
      # run Hugo receive the file, never the token.
      - name: Write the published releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$RUNNER_TEMP/releases.json"
          gh release list --repo "${{ github.repository }}" --limit 1000 --json tagName,isDraft,isPrerelease > "$releases"
          printf 'file=%s\n' "$releases" >> "$GITHUB_OUTPUT"
      - name: Check the site against every published release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: make site-check SITE_RELEASES="${{ steps.releases.outputs.file }}"
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Check the deployment address
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: bash scripts/site-baseurl-check.sh "${{ steps.pages.outputs.base_url }}"
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/site/public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
