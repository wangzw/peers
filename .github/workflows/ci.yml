name: CI

# Every commit is tested once: a push to main, a pull request through
# pull_request, and any other branch on demand through workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every timeout-minutes below is sized to cover a cold-cache run plus one
# stalled action download (about 282 s as measured). Size any change to a limit
# the same way.
jobs:
  lint:
    name: lint and generate
    runs-on: ubuntu-24.04
    # The slowest of the last 30 main runs took 170 s. The shard coverage check
    # below took 19 s in probe run 45025902666, whose job took 153 s against
    # 115 s in baseline run 45021559562. With the module cache restored, empty
    # build and golangci-lint caches add about 210 s measured on four cores,
    # including the check compiling the end-to-end test packages. The resulting
    # 399 s plus one stalled action download (282 s) comes to 681 s, past the
    # 600 s a 10-minute limit allows, so the limit is 15 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # Install the prebuilt releases instead of compiling from source with
      # go install. The versions are the ones this job installed before.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The ubuntu-24.04 runner image ships shellcheck, so make lint calls it
      # without an apt install. Print the version every run so a missing or
      # changed tool fails here instead of inside the gate.
      - name: Confirm shellcheck
        run: shellcheck --version
      - name: Run the lint and generation gates
        run: make lint proto-lint gen-check
      # The shard table must cover every end-to-end package and top-level test
      # exactly once, so a new test cannot silently drop out of the gate. This
      # job is not on the end-to-end critical path, so the check runs here
      # rather than in an e2e shard; a failure still fails the workflow.
      #
      # The default success() condition would skip this step behind a failing
      # gate above, so a run that breaks both would report the lint failure
      # only. It runs unless the job is cancelled, which reports both results
      # in one run without spending the runner on a cancelled job.
      - name: Check that the shard table covers every package and test
        if: ${{ !cancelled() }}
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/e2e-shards.XXXXXX")"
          go build -o "$dir/e2e-shards" ./scripts/e2e-shards
          "$dir/e2e-shards" -check

  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    # A cold-cache run is estimated at 334 s, and one run stalled 282 s
    # downloading an action. Together they come to 616 s, past the 600 s that a
    # 10-minute limit allows, so the limit is 15 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # Linux sun_path holds 108 bytes including the trailing NUL, so a TMPDIR
      # deep enough to push a test's socket path past that limit exposes sites
      # that build it by hand.
      - name: Run the tests
        shell: bash
        run: |
          deep="$RUNNER_TEMP/deep-tmpdir-for-socket-paths-over-sun-path-linux-test-run"
          if [ "${#deep}" -lt 80 ]; then
            echo "::error::TMPDIR $deep is ${#deep} bytes, want at least 80" >&2
            exit 1
          fi
          mkdir -p "$deep"
          echo "TMPDIR is ${#deep} bytes: $deep"
          export TMPDIR="$deep"
          make test JOBS=4 COVER_DIR="${{ runner.temp }}/cover"
      # These tests change file ownership or start a child as another account,
      # so they need root and skip themselves otherwise. PATH keeps the
      # setup-go toolchain visible and HOME keeps the Go caches in the same
      # place the non-root step used. The root round is not instrumented,
      # because its data is not counted anywhere.
      - name: Run the tests that need root
        run: sudo --preserve-env=PATH,HOME make test-root JOBS=2
      # The coverage job merges these counters with the end-to-end ones. Both
      # test rounds sit below one artifact, so the download names them
      # coverage-test/unit and coverage-test/testenv.
      - name: Upload the test coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-test
          path: |
            ${{ runner.temp }}/cover/unit
            ${{ runner.temp }}/cover/testenv
          if-no-files-found: error
          retention-days: 7

  docs-check:
    name: documentation
    runs-on: ubuntu-24.04
    # The slowest of the last 30 main runs took 186 s, 148 s of it downloading
    # an action, and the npm install and the checker clone are cold every run.
    # The old limit left only 114 s of headroom, so the worst case plus a fixed
    # three-minute margin rounds up to 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # scripts/docs-check.sh runs the document standards checker from this
      # skill path. The skill lives outside the repository, so fetch the pinned
      # commit into the per-account location the script reads. A failed clone or
      # a missing script fails this step rather than letting CI=true skip the
      # check.
      - name: Install the document standards checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$HOME/.claude/skills/document-standards"
          commit="ada039cd0d4476ec12e9e49c8c213706e75258de"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/wangzw/document-standards.git
          # Authenticate the fetch with the job token so anonymous git rate
          # limiting cannot turn it into a 403. The header is passed only
          # through -c for this one fetch, so it reaches no config file, and
          # the token stays in the environment: no set -x and no echo of a
          # value, only the attempt number. GitHub masks GITHUB_TOKEN itself
          # but not a string derived from it, so add-mask registers the
          # header value too and GIT_TRACE would show *** instead.
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          delays=(5 15)
          attempt=1
          fetched=0
          while [ "$attempt" -le 3 ]; do
            if git -C "$dir" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$commit"; then
              fetched=1
              break
            fi
            echo "fetch attempt $attempt of 3 failed"
            if [ "$attempt" -lt 3 ]; then
              sleep "${delays[$((attempt - 1))]}"
            fi
            attempt=$((attempt + 1))
          done
          if [ "$fetched" -ne 1 ]; then
            echo "::error::could not fetch document-standards $commit after 3 attempts" >&2
            exit 1
          fi
          git -C "$dir" checkout -q FETCH_HEAD
          test -f "$dir/scripts/check_documents.py"
      # mermaid-cli renders through Chromium; puppeteer downloads one during
      # the install. Ubuntu 23.10 and later restrict unprivileged user
      # namespaces, so the hosted runner cannot start Chromium's own sandbox
      # and the render needs --no-sandbox from this configuration.
      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli@12.2.0
          mmdc --version
          printf '{"args":["--no-sandbox"]}\n' > "$RUNNER_TEMP/puppeteer.json"
      # CI renders every documentation file instead of the ones that differ
      # from origin/main. On a push to main, checkout leaves origin/main at the
      # pushed commit, so the changed set would always be empty. The full set
      # is small (a dozen diagrams) and also covers a pull request that does
      # not touch the documentation.
      - name: Run the documentation gate
        env:
          DOCS_CHECK_ALL: "1"
          DOCS_CHECK_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
        run: make docs-check

  macos:
    name: test (macOS)
    runs-on: macos-latest
    # The slowest of the last 30 main runs took 345 s. Empty module and build
    # caches add about 155 s; 1.5 times the total stays within 15 minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the tests
        run: make test JOBS=4
      # These tests need root and skip themselves otherwise. The pairing test
      # changes file ownership, and the config test reads a security ACL that
      # only root can see. The overrides narrow test-root to those two cases;
      # PATH keeps the setup-go toolchain visible and HOME keeps the Go caches
      # in the same place the non-root step used.
      - name: Run the tests that need root
        run: sudo --preserve-env=PATH,HOME make test-root JOBS=2 ROOT_TEST_PKGS="./internal/pairing ./internal/config" ROOT_TEST_RUN='^(TestIdentityRejectsForeignOwner|TestConfigFileRootOnlyWritableDarwin)$$' ROOT_TEST_CASES="github.com/wangzw/peers/internal/pairing:TestIdentityRejectsForeignOwner github.com/wangzw/peers/internal/config:TestConfigFileRootOnlyWritableDarwin"

  macos-service:
    name: service end-to-end
    runs-on: macos-latest
    # The slowest of the last 30 main runs took 148 s; empty module and build
    # caches leave it far below 40 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the macOS service end-to-end tests
        run: make e2e-darwin
      - name: Clean up the installed services
        if: always()
        run: |
          uid="$(id -u)"
          launchctl bootout "gui/$uid/io.github.wangzw.peers" 2>/dev/null || true
          sudo launchctl bootout "system/io.github.wangzw.peers" 2>/dev/null || true
          sudo pkill -f 'peers-test broker --system --listen :17446' 2>/dev/null || true
          rm -f "$HOME/Library/LaunchAgents/io.github.wangzw.peers.plist"
          sudo rm -f "/Library/LaunchDaemons/io.github.wangzw.peers.plist"
          sudo rm -f /usr/local/libexec/peers-test
          sudo rm -f /usr/local/libexec/peers-e2e
          # Remove the many-group test account and groups only when the name
          # still carries the id the test uses. A real account with a different
          # id is left alone and reported.
          cleanup_user() {
            name="$1"
            want="$2"
            have="$(sudo dscl . -read "/Users/$name" UniqueID 2>/dev/null | awk '{print $2}')" || true
            if [ -z "$have" ]; then
              return 0
            fi
            if [ "$have" != "$want" ]; then
              echo "skip user $name: uid $have, want $want"
              return 0
            fi
            sudo dscl . -delete "/Users/$name" 2>/dev/null || true
          }
          cleanup_group() {
            name="$1"
            want="$2"
            have="$(sudo dscl . -read "/Groups/$name" PrimaryGroupID 2>/dev/null | awk '{print $2}')" || true
            if [ -z "$have" ]; then
              return 0
            fi
            if [ "$have" != "$want" ]; then
              echo "skip group $name: gid $have, want $want"
              return 0
            fi
            sudo dscl . -delete "/Groups/$name" 2>/dev/null || true
          }
          cleanup_user approbe 6501
          i=1
          while [ "$i" -le 20 ]; do
            n="$(printf '%02d' "$i")"
            cleanup_group "apg$n" "$((6100 + i))"
            i=$((i + 1))
          done
          cleanup_group apneg 6199

  e2e:
    name: end-to-end tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # E2E_TIMEOUT in the Makefile bounds the test binary; setup and cleanup
    # need room beyond it. The slowest of the last 30 main runs took 648 s, and
    # empty module and build caches leave it far below 45 minutes.
    timeout-minutes: 45
    strategy:
      # A failing shard must not cancel the others: their results show whether
      # the failure belongs to this shard's tests or to the split itself.
      fail-fast: false
      matrix:
        # scripts/e2e-shards/e2e-shards.txt assigns every package and every
        # top-level test to one of these shards. A package listed by several
        # shards is split by test name, so the system shard and system-b each
        # run part of test/e2e/system.
        shard: [top-a, top-b, system, system-b]
    steps:
      # The cross-version update test builds the v0.4.0 release from its tag, so
      # the checkout needs the tags and the commits they point at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # The selection calls the shard tool, so build it once and reuse the
      # binary. It goes into the runner's temporary directory rather than the
      # checkout, and the following step reads its path from GITHUB_ENV.
      - name: Build the shard tool
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/e2e-shards.XXXXXX")"
          go build -o "$dir/e2e-shards" ./scripts/e2e-shards
          echo "E2E_SHARDS=$dir/e2e-shards" >> "$GITHUB_ENV"
      - name: Select the end-to-end shard
        run: |
          echo "E2E_PKGS=$("$E2E_SHARDS" -shard '${{ matrix.shard }}' -print packages)" >> "$GITHUB_ENV"
          run="$("$E2E_SHARDS" -shard '${{ matrix.shard }}' -print run)"
          if [ -n "$run" ]; then
            echo "E2E_RUN=$run" >> "$GITHUB_ENV"
          fi
      - name: Run the end-to-end tests
        # bash makes the pipeline fail when make e2e fails: GitHub runs a
        # shell: bash step with -eo pipefail, so the exit status is not tee's.
        shell: bash
        env:
          # The harness writes the logs and Broker stacks of a failing test
          # below this directory; the step below scans and uploads it.
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          make e2e JOBS="$(nproc)" COVER_DIR="${{ runner.temp }}/cover" 2>&1 | tee "$E2E_ARTIFACTS/test.log"
      # A Go stack written by SIGQUIT and a Broker log carry no pairing key by
      # design, but the upload must not rely on that alone. The scan refuses
      # the upload when a one-time key or a secret-bearing environment
      # assignment appears anywhere in the dump or the test log.
      - name: Scan the end-to-end artifacts for secrets
        id: scan
        if: failure()
        run: |
          dir="${{ runner.temp }}/e2e-artifacts"
          if [ ! -d "$dir" ]; then
            echo "no artifact directory was written; nothing to scan"
            exit 0
          fi
          # The pairing key alphabet is upper case only, and the value is
          # matched with word boundaries, so a lower-case UUID in a Broker log
          # is not mistaken for a key.
          if grep -rEq '\b[0-9A-HJKMNP-TV-Z]{4}(-[0-9A-HJKMNP-TV-Z]{4}){3}\b|^[A-Z0-9_]*(KEY|TOKEN|SECRET)[A-Z0-9_]*=' "$dir"; then
            echo "::error::the end-to-end artifacts carry a pairing key or a secret environment assignment; refusing to upload"
            exit 1
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::scanning the end-to-end artifacts failed with exit code $status; refusing to upload"
              exit 1
            fi
          fi
      - name: Upload the end-to-end artifacts
        if: failure() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7
      # A single directory path publishes its contents at the artifact root,
      # so the download leaves plain covdata under coverage-e2e-<shard> rather
      # than a second e2e/ level.
      - name: Upload the end-to-end coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-e2e-${{ matrix.shard }}
          path: ${{ runner.temp }}/cover/e2e
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage meets the thresholds
    runs-on: ubuntu-24.04
    needs: [test, e2e]
    # The job merges what the producers published and applies the coverage
    # floors: the merge over the unit and testenv rounds took 2.1 s measured
    # locally, and the e2e counters join the same one-pass merge. A cold module
    # cache plus one stalled action download (282 s) stays well inside 10
    # minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # Download leaves one directory per artifact, named after it: coverage-test
      # holds unit/ and testenv/ below it once extracted, and each e2e shard's
      # counters sit directly in coverage-e2e-<shard>. skip-decompress keeps the
      # action's unzip path, which emits the DEP0005 Buffer() deprecation, out
      # of the log; the report step extracts each archive itself. The report
      # step derives its input list from these directories, so a shard added to
      # the e2e matrix needs no change here.
      - name: Download the coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Extglob, not coverage-*: a re-run also leaves coverage-profile, which has no covmeta.
          pattern: coverage-@(test|e2e-*)
          path: ${{ runner.temp }}/cover
          skip-decompress: true
      # cover-check enforces the COVER_TOTAL and COVER_PACKAGE floors, so a
      # shortfall fails this step and the workflow, and a fail-closed error in
      # coverreport fails it too. Every downloaded artifact directory must
      # carry counters, so an upload that produced none fails the step instead
      # of being merged partly. The table must still reach the step summary
      # when the check fails: shell: bash supplies pipefail, so the pipeline
      # keeps make's exit status, and tee -a appends the table either way.
      - name: Enforce the coverage thresholds
        shell: bash
        run: |
          cover="${{ runner.temp }}/cover"
          # skip-decompress left one raw archive inside the directory named after
          # each artifact; extract it there so the layout matches a normal
          # download, and fail on any unzip error.
          for artifact in "$cover"/coverage-*/; do
            artifact="${artifact%/}"
            [ -d "$artifact" ] || continue
            zipfile="$(find "$artifact" -mindepth 1 -maxdepth 1 -type f -print -quit)"
            if [ -z "$zipfile" ]; then
              echo "::error::$(basename "$artifact") holds no downloaded archive"
              exit 1
            fi
            if ! unzip -q -o "$zipfile" -d "$artifact"; then
              echo "::error::$(basename "$artifact") failed to extract its archive"
              exit 1
            fi
            rm -f "$zipfile"
          done
          has_both() {
            [ -d "$1" ] || return 1
            [ -n "$(find "$1" -maxdepth 1 -type f -name 'covmeta.*' -print -quit)" ] &&
              [ -n "$(find "$1" -maxdepth 1 -type f -name 'covcounters.*' -print -quit)" ]
          }
          counters() {
            find "$1" -mindepth 1 -maxdepth 2 -type f \
              \( -name 'covmeta.*' -o -name 'covcounters.*' \) -print -quit
          }
          # make test exits 0 when a round finds no tests to run, and the upload
          # still succeeds because the other round carries files, so both rounds
          # are checked here or the report would silently lose one.
          for round in unit testenv; do
            if ! has_both "$cover/coverage-test/$round"; then
              echo "::error::coverage-test/$round carries no covmeta and covcounters"
              exit 1
            fi
          done
          dirs="$(find "$cover" -mindepth 2 -maxdepth 3 -type f \
            \( -name 'covmeta.*' -o -name 'covcounters.*' \) -printf '%h\n' | sort -u)"
          if [ -z "$dirs" ]; then
            echo "::error::no coverage data under $cover"
            exit 1
          fi
          for artifact in "$cover"/coverage-*/; do
            artifact="${artifact%/}"
            if [ -z "$(counters "$artifact")" ]; then
              echo "::error::$(basename "$artifact") carries no coverage data"
              exit 1
            fi
          done
          inputs=""
          while IFS= read -r dir; do
            inputs="${inputs:+$inputs }${dir#"$cover"/}"
          done <<< "$dirs"
          make cover-check \
            COVER_DIR="$cover" \
            COVER_FORMAT=markdown \
            COVER_INPUTS="$inputs" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The profile is what diagnoses a failed gate, so it is uploaded after a
      # failing enforce step too; success() || failure() skips only a cancelled
      # run. A run that failed before coverreport wrote the file has nothing to
      # upload, hence ignore here while the enforce step already carries the
      # verdict.
      - name: Upload the coverage profile
        if: success() || failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-profile
          path: ${{ runner.temp }}/cover/coverage.txt
          if-no-files-found: ignore
          retention-days: 7

  third-party-licenses:
    name: third-party licenses are current
    runs-on: ubuntu-24.04
    # The slowest run spent 282 s downloading an action and was cancelled at
    # the old 300 s limit. Empty module and build caches add about 90 s, and a
    # fixed three-minute margin over the resulting 404 s rounds up to 10
    # minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Regenerate the licenses and compare them with the committed copy
        run: |
          d="$RUNNER_TEMP/licenses"
          go tool go-licenses save ./cmd/peers --save_path="$d" --force --ignore github.com/wangzw/peers
          if [ ! -d "$d" ]; then
            echo "::error::go-licenses did not create $d; no license inventory was generated to compare" >&2
            exit 1
          fi
          diff -r "$d" THIRD_PARTY_LICENSES

  release-config:
    name: goreleaser config
    runs-on: ubuntu-24.04
    # The slowest of the last 30 main runs took 131 s. Empty module and build
    # caches add about 155 s, twice the 77 s measured on four cores, to the two
    # four-platform goreleaser runs; 1.5 times the total rounds up to 10
    # minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.20.2"
          install-only: true
      - name: Check the goreleaser configuration
        run: goreleaser check
      - name: Check that the release notes become the published body
        run: make release-notes-check
      - name: Check the contents of every release archive
        run: make archive-check

  third-party-source:
    name: third-party sources match their upstreams
    runs-on: ubuntu-24.04
    # The slowest of the last 30 main runs took 23 s. The check downloads the
    # upstream modules, and a cold-cache run stays far below 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Compare the vendored sources with third_party/UPSTREAM
        run: make third-party-check

  vulncheck:
    name: vulnerability scan
    runs-on: ubuntu-24.04
    # The slowest run took 175 s, 143 s of it setting up the job. Empty module
    # and build caches and the govulncheck install add about 90 s; 1.5 times
    # the total rounds up to 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Scan the module graph for known vulnerabilities
        run: make vulncheck
