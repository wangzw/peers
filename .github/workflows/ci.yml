name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint and generate
    runs-on: ubuntu-24.04
    # Median of the last five runs is 106 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # Install the prebuilt releases instead of compiling from source with
      # go install. The versions are the ones this job installed before.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # The ubuntu-24.04 runner image ships shellcheck, so make lint calls it
      # without an apt install. Print the version every run so a missing or
      # changed tool fails here instead of inside the gate.
      - name: Confirm shellcheck
        run: shellcheck --version
      - name: Run the lint and generation gates
        run: make lint proto-lint gen-check

  test:
    name: test (linux)
    runs-on: ubuntu-24.04
    # Median of the last five runs is 180 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the tests
        run: make test JOBS=4
      # These tests change file ownership or start a child as another account,
      # so they need root and skip themselves otherwise. PATH keeps the
      # setup-go toolchain visible and HOME keeps the Go caches in the same
      # place the non-root step used.
      - name: Run the tests that need root
        run: sudo --preserve-env=PATH,HOME make test-root JOBS=2

  docs-check:
    name: documentation
    runs-on: ubuntu-24.04
    # Median of the last five runs is 43 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # scripts/docs-check.sh runs the document standards checker from this
      # skill path. The skill lives outside the repository, so fetch the pinned
      # commit into the per-account location the script reads. A failed clone or
      # a missing script fails this step rather than letting CI=true skip the
      # check.
      - name: Install the document standards checker
        run: |
          dir="$HOME/.claude/skills/document-standards"
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/wangzw/document-standards.git
          git -C "$dir" fetch -q --depth 1 origin ada039cd0d4476ec12e9e49c8c213706e75258de
          git -C "$dir" checkout -q FETCH_HEAD
          test -f "$dir/scripts/check_documents.py"
      # mermaid-cli renders through Chromium; puppeteer downloads one during
      # the install. Ubuntu 23.10 and later restrict unprivileged user
      # namespaces, so the hosted runner cannot start Chromium's own sandbox
      # and the render needs --no-sandbox from this configuration.
      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli@12.2.0
          mmdc --version
          printf '{"args":["--no-sandbox"]}\n' > "$RUNNER_TEMP/puppeteer.json"
      # CI renders every documentation file instead of the ones that differ
      # from origin/main. On a push to main, checkout leaves origin/main at the
      # pushed commit, so the changed set would always be empty. The full set
      # is small (a dozen diagrams) and also covers a pull request that does
      # not touch the documentation.
      - name: Run the documentation gate
        env:
          DOCS_CHECK_ALL: "1"
          DOCS_CHECK_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
        run: make docs-check

  macos:
    name: test (macOS)
    runs-on: macos-latest
    # Median of the last five runs is 207 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the tests
        run: make test JOBS=4
      # These tests need root and skip themselves otherwise. The pairing test
      # changes file ownership, and the config test reads a security ACL that
      # only root can see. The overrides narrow test-root to those two cases;
      # PATH keeps the setup-go toolchain visible and HOME keeps the Go caches
      # in the same place the non-root step used.
      - name: Run the tests that need root
        run: sudo --preserve-env=PATH,HOME make test-root JOBS=2 ROOT_TEST_PKGS="./internal/pairing ./internal/config" ROOT_TEST_RUN='^(TestIdentityRejectsForeignOwner|TestConfigFileRootOnlyWritableDarwin)$$' ROOT_TEST_CASES="github.com/wangzw/peers/internal/pairing:TestIdentityRejectsForeignOwner github.com/wangzw/peers/internal/config:TestConfigFileRootOnlyWritableDarwin"

  macos-service:
    name: service end-to-end
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Run the macOS service end-to-end tests
        run: make e2e-darwin
      - name: Clean up the installed services
        if: always()
        run: |
          uid="$(id -u)"
          launchctl bootout "gui/$uid/io.github.wangzw.peers" 2>/dev/null || true
          sudo launchctl bootout "system/io.github.wangzw.peers" 2>/dev/null || true
          sudo pkill -f 'peers-test broker --system --listen :17446' 2>/dev/null || true
          rm -f "$HOME/Library/LaunchAgents/io.github.wangzw.peers.plist"
          sudo rm -f "/Library/LaunchDaemons/io.github.wangzw.peers.plist"
          sudo rm -f /usr/local/libexec/peers-test
          sudo rm -f /usr/local/libexec/peers-e2e
          # Remove the many-group test account and groups only when the name
          # still carries the id the test uses. A real account with a different
          # id is left alone and reported.
          cleanup_user() {
            name="$1"
            want="$2"
            have="$(sudo dscl . -read "/Users/$name" UniqueID 2>/dev/null | awk '{print $2}')" || true
            if [ -z "$have" ]; then
              return 0
            fi
            if [ "$have" != "$want" ]; then
              echo "skip user $name: uid $have, want $want"
              return 0
            fi
            sudo dscl . -delete "/Users/$name" 2>/dev/null || true
          }
          cleanup_group() {
            name="$1"
            want="$2"
            have="$(sudo dscl . -read "/Groups/$name" PrimaryGroupID 2>/dev/null | awk '{print $2}')" || true
            if [ -z "$have" ]; then
              return 0
            fi
            if [ "$have" != "$want" ]; then
              echo "skip group $name: gid $have, want $want"
              return 0
            fi
            sudo dscl . -delete "/Groups/$name" 2>/dev/null || true
          }
          cleanup_user approbe 6501
          i=1
          while [ "$i" -le 20 ]; do
            n="$(printf '%02d' "$i")"
            cleanup_group "apg$n" "$((6100 + i))"
            i=$((i + 1))
          done
          cleanup_group apneg 6199

  e2e:
    name: end-to-end tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # E2E_TIMEOUT in the Makefile bounds the test binary; setup and cleanup
    # need room beyond it.
    timeout-minutes: 45
    strategy:
      # A failing shard must not cancel the others: their results show whether
      # the failure belongs to this shard's tests or to the split itself.
      fail-fast: false
      matrix:
        # scripts/e2e-shards/e2e-shards.txt assigns every package and every
        # top-level test to one of these shards.
        shard: [top-a, top-b, system]
    steps:
      # The cross-version update test builds the v0.4.0 release from its tag, so
      # the checkout needs the tags and the commits they point at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      # The check fails when a package or a top-level test falls into no shard
      # or into more than one, so a new test cannot silently drop out of the
      # gate. One shard runs it because it examines the whole table.
      - name: Check that the shard table covers every package and test
        if: matrix.shard == 'top-a'
        run: go run ./scripts/e2e-shards -check
      - name: Select the end-to-end shard
        run: |
          echo "E2E_PKGS=$(go run ./scripts/e2e-shards -shard '${{ matrix.shard }}' -print packages)" >> "$GITHUB_ENV"
          run="$(go run ./scripts/e2e-shards -shard '${{ matrix.shard }}' -print run)"
          if [ -n "$run" ]; then
            echo "E2E_RUN=$run" >> "$GITHUB_ENV"
          fi
      - name: Run the end-to-end tests
        run: make e2e JOBS="$(nproc)"

  third-party-licenses:
    name: third-party licenses are current
    runs-on: ubuntu-24.04
    # Median of the last five runs is 18 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Regenerate the licenses and compare them with the committed copy
        run: |
          d="$RUNNER_TEMP/licenses"
          go tool go-licenses save ./cmd/peers --save_path="$d" --force --ignore github.com/wangzw/peers
          if [ ! -d "$d" ]; then
            echo "::error::go-licenses did not create $d; no license inventory was generated to compare" >&2
            exit 1
          fi
          diff -r "$d" THIRD_PARTY_LICENSES

  release-config:
    name: goreleaser config
    runs-on: ubuntu-24.04
    # Median of the last five runs is 89 s; three times that rounded up to
    # the next five minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.20.2"
          install-only: true
      - name: Check the goreleaser configuration
        run: goreleaser check
      - name: Check that the release notes become the published body
        run: make release-notes-check
      - name: Check the contents of every release archive
        run: make archive-check

  third-party-source:
    name: third-party sources match their upstreams
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Compare the vendored sources with third_party/UPSTREAM
        run: make third-party-check

  vulncheck:
    name: vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          cache: true
      - name: Scan the module graph for known vulnerabilities
        run: make vulncheck
