name: Real session probe

on:
  push:
    branches: ["probe/**", "probe-macos/**"]

permissions:
  contents: read

concurrency:
  group: real-session
  cancel-in-progress: false

jobs:
  probe:
    if: startsWith(github.ref_name, 'probe/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R: /tmp/peers-rs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          # The probe runs beside the OAuth token, so this job restores no
          # build cache that another workflow could write.
          cache: false
      - name: Select the probe
        run: |
          p="${GITHUB_REF_NAME#probe/}"
          case "$p" in
            selftest) ;;
            preflight) ;;
            binding) ;;
            registry) ;;
            ref-clear) ;;
            inbound) ;;
            signature) ;;
            reply) ;;
            mcp-toggle) ;;
            subagent) ;;
            headless) ;;
            broker-down) ;;
            permissions) ;;
            ratelimit) ;;
            *)
              echo "unknown probe: $p" >&2
              exit 1
              ;;
          esac
          echo "PROBE=$p" >> "$GITHUB_ENV"
      - name: Install tools
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 tmux strace stress-ng jq
      - name: Install Claude Code
        timeout-minutes: 10
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.311
          "$HOME/.local/bin/claude" --version
      - name: Build
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/peers" ./cmd/peers
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/rsprobe" ./test/realsession/rsprobe
      - name: Prepare
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          "$RUNNER_TEMP/build/rsprobe" env init --root "$R" --claude-bin "$(readlink -f "$HOME/.local/bin/claude")" --peers-bin "$RUNNER_TEMP/build/peers"
          "$R/bin/rsprobe" env check --root "$R"
          "$R/run" claude mcp add --scope user peer -- "$R/bin/peers" mcp
      - name: Run the probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash "test/realsession/probes/$PROBE.sh"
      - name: Count model calls
        if: always()
        run: '"$R/bin/rsprobe" env usage --root "$R" > "$R/out/$PROBE/usage.txt"'
      - name: Clean up
        if: always()
        run: '"$R/bin/rsprobe" env clean --root "$R"'
      - name: Scan the evidence for the token
        id: scan
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          status=0
          grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$R/out" || status=$?
          if [ "$status" -eq 0 ]; then
            rm -rf "$R/out"
            echo "the evidence contains the token; removed it and skipped the upload" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "cannot scan the evidence: grep exited with status $status" >&2
            exit 1
          fi
      - name: Upload
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: probe-${{ env.PROBE }}
          path: /tmp/peers-rs/out/${{ env.PROBE }}/
          if-no-files-found: error
          retention-days: 30

  # The macOS job runs the probes that need no Linux-only tooling: it installs
  # tmux and jq through Homebrew, copies the same pinned Claude Code build and
  # peers binaries, and runs the same probe scripts. The Linux job keeps
  # the apt packages, strace and stress-ng, which no macOS probe uses.
  #
  # The probe root is /private/tmp rather than /tmp because macOS makes /tmp a
  # symlink to /private/tmp. Claude Code keys its workspace trust entries by
  # the resolved path, so a root under /tmp would miss the entry env init wrote
  # and every session would stop at the trust dialog before registering.
  probe-macos:
    if: startsWith(github.ref_name, 'probe-macos/')
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      R: /private/tmp/peers-rs
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          # The probe runs beside the OAuth token, so this job restores no
          # build cache that another workflow could write.
          cache: false
      - name: Select the probe
        run: |
          p="${GITHUB_REF_NAME#probe-macos/}"
          case "$p" in
            preflight) ;;
            registry) ;;
            *)
              echo "unknown macOS probe: $p" >&2
              exit 1
              ;;
          esac
          echo "PROBE=$p" >> "$GITHUB_ENV"
      - name: Install tools
        timeout-minutes: 10
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux jq
          tmux -V
          jq --version
      - name: Install Claude Code
        timeout-minutes: 10
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.311
          "$HOME/.local/bin/claude" --version
      - name: Build
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/peers" ./cmd/peers
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build/rsprobe" ./test/realsession/rsprobe
      - name: Prepare
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          # macOS readlink has no -f; python3 resolves the installed symlink.
          claude_bin="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$HOME/.local/bin/claude")"
          "$RUNNER_TEMP/build/rsprobe" env init --root "$R" --claude-bin "$claude_bin" --peers-bin "$RUNNER_TEMP/build/peers"
          "$R/bin/rsprobe" env check --root "$R"
          "$R/run" claude mcp add --scope user peer -- "$R/bin/peers" mcp
      - name: Run the probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash "test/realsession/probes/$PROBE.sh"
      - name: Count model calls
        if: always()
        run: '"$R/bin/rsprobe" env usage --root "$R" > "$R/out/$PROBE/usage.txt"'
      - name: Clean up
        if: always()
        run: '"$R/bin/rsprobe" env clean --root "$R"'
      - name: Scan the evidence for the token
        id: scan
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "secret CLAUDE_CODE_OAUTH_TOKEN is missing" >&2
            exit 1
          fi
          status=0
          grep -rqF -- "$CLAUDE_CODE_OAUTH_TOKEN" "$R/out" || status=$?
          if [ "$status" -eq 0 ]; then
            rm -rf "$R/out"
            echo "the evidence contains the token; removed it and skipped the upload" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "cannot scan the evidence: grep exited with status $status" >&2
            exit 1
          fi
      - name: Upload
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: probe-macos-${{ env.PROBE }}
          path: /private/tmp/peers-rs/out/${{ env.PROBE }}/
          if-no-files-found: error
          retention-days: 30
