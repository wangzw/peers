name: Release

on:
  push:
    tags:
      - "v*"

# The goreleaser job creates the release, so it is the only job that needs
# contents: write. Every other job, and the workflow default, gets read only.
permissions:
  contents: read

jobs:
  # A prerelease tag leaves this job successful without running the check. Any
  # other v* tag fails the run: it is neither a release tag nor a prerelease, so
  # publishing it would be wrong.
  release-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      LYCHEE_VERSION: 0.24.2
    steps:
      - name: Classify the tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*$ ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release-check: tag '$GITHUB_REF_NAME' is neither a release tag vX.Y.Z nor a prerelease tag vX.Y.Z-<suffix>" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.tag.outputs.release == 'true'
        with:
          # The check compares against every tag and reads origin/main, which
          # a shallow clone does not provide.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        if: steps.tag.outputs.release == 'true'
        with:
          go-version-file: docs/site/go.mod
          cache: false
      - name: Install Hugo
        if: steps.tag.outputs.release == 'true'
        run: |
          version="$(sed -n 's/^HUGO_VERSION[[:space:]]*[:?]=[[:space:]]*//p' Makefile)"
          base="https://github.com/gohugoio/hugo/releases/download/v${version}"
          curl -sSL -o /tmp/hugo_checksums.txt "${base}/hugo_${version}_checksums.txt"
          checksum="$(grep " hugo_${version}_linux-amd64.tar.gz$" /tmp/hugo_checksums.txt | awk '{print $1}')"
          test -n "$checksum"
          curl -sSL -o /tmp/hugo.tar.gz "${base}/hugo_${version}_linux-amd64.tar.gz"
          printf '%s  %s\n' "$checksum" /tmp/hugo.tar.gz | sha256sum -c -
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install -m 0755 /tmp/hugo /usr/local/bin/hugo
          hugo version
      - name: Install lychee
        if: steps.tag.outputs.release == 'true'
        run: |
          archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -sSL -o "/tmp/${archive}" "${base}/${archive}"
          curl -sSL -o "/tmp/${archive}.sha256" "${base}/${archive}.sha256"
          checksum="$(awk '{print $1}' "/tmp/${archive}.sha256")"
          printf '%s  %s\n' "$checksum" "/tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 /tmp/lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
          lychee --version
      - name: Check the release
        if: steps.tag.outputs.release == 'true'
        run: make release-check VERSION="$GITHUB_REF_NAME"

  goreleaser:
    runs-on: ubuntu-24.04
    needs: release-check
    permissions:
      contents: write
    env:
      # A release must build from the module graph recorded in go.sum, never
      # from a resolution that would update it.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # goreleaser reads the token from the environment; the checkout has
          # no reason to keep credentials in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
          # The published binary is installed as root by a system Broker. A Go
          # build cache entry is not covered by go.sum, so this job restores
          # none: every object is compiled from the source and the modules the
          # next step verifies.
          cache: false
      - name: Verify the module graph
        run: |
          go mod download
          go mod verify
      - name: Extract the release notes
        run: go run ./scripts/release-notes -version "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "v2.20.2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
