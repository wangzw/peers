name: Feature request
description: Suggest an addition or a change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read "Known limitations" in the documentation first; some things are out of scope by design.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested approach
      description: How you think it could work, if you have an idea.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you tried or considered, including workarounds.
