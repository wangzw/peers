baseURL: https://peers.zhanwei.wang/
title: peers
locale: en

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
# The site has no tags or categories. Disabling both kinds keeps empty
# taxonomy pages out of the build, the sitemap and the search index.
disableKinds:
  - taxonomy
  - term

# Every crawler, AI ones included, may read the whole site. The template in
# layouts/robots.txt allows them all and points to the sitemap derived from
# baseURL; Hugo writes it once, for the default content language.
enableRobotsTXT: true

# llms.txt and llms-full.txt are generated for each language from the site's
# pages by the templates in layouts/. They are plain text for models to read,
# so they stay out of the sitemap and the navigation.
outputFormats:
  llms:
    name: llms
    baseName: llms
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  llmsfull:
    name: llmsfull
    baseName: llms-full
    mediaType: text/plain
    isPlainText: true
    notAlternative: true
  # Hugo's built-in markdown format sets ugly and would write docs/faq.md; the
  # rewrite rule below needs docs/faq/index.md.
  markdown:
    name: markdown
    baseName: index
    mediaType: text/markdown
    isPlainText: true
    ugly: false

# Every page is also published as Markdown, as index.md next to its
# index.html. GitHub Pages cannot choose a representation from the Accept
# header, so a Cloudflare URL rewrite rule on the zone does it:
#   when:    http.host eq "peers.zhanwei.wang"
#            and ends_with(http.request.uri.path, "/")
#            and any(http.request.headers["accept"][*] contains "text/markdown")
#   rewrite: the path to concat(http.request.uri.path, "index.md")
# The rule matches every path on this host that ends in a slash, so an
# index.html without an index.md answers such a request with 404; make
# site-check fails on one.
outputs:
  home:
    - HTML
    - RSS
    - llms
    - llmsfull
    - markdown
  section:
    - HTML
    - RSS
    - markdown
  page:
    - HTML
    - markdown

module:
  imports:
    - path: github.com/imfing/hextra
  # Declaring mounts replaces Hugo's default mounts, so the ones this site
  # relies on are listed again. Each content mount belongs to the language
  # whose contentDir it backs, and the last mount publishes only the demo
  # videos under docs/assets as /demo/demo-*.mp4. The GIFs stay out of the
  # site build because the README uses them.
  mounts:
    - source: content/en
      target: content
      sites:
        matrix:
          languages: [en]
    - source: content/zh
      target: content
      sites:
        matrix:
          languages: [zh]
    - source: data
      target: data
    - source: layouts
      target: layouts
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: assets
      target: assets
    - source: static
      target: static
    - source: ../assets
      target: static/demo
      files:
        - '*.mp4'

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  navbar:
    displayTitle: true
    displayLogo: false
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: true
    base: https://github.com/wangzw/peers/edit/main/docs/site/content
  footer:
    displayCopyright: false
    displayPoweredBy: false
  theme:
    default: system
    displayToggle: true

languages:
  en:
    label: English
    locale: en
    contentDir: content/en
    weight: 1
    title: peers
    params:
      description: peers lets Claude Code sessions running on different hosts discover each other and exchange text messages.
      images:
        - images/social-card-en.png
      llms:
        documentation: Documentation
        additional: More documentation
        more: More
        full: The full documentation as one plain-text file.
        repository: peers on GitHub
    menus:
      main:
        - name: Documentation
          pageRef: /docs
          weight: 1
        - name: Search
          weight: 2
          params:
            type: search
        - name: Language
          weight: 3
          params:
            type: language-switch
        - name: GitHub
          weight: 4
          url: https://github.com/wangzw/peers
          params:
            icon: github
  zh:
    label: 中文
    locale: zh-CN
    contentDir: content/zh
    weight: 2
    title: peers
    params:
      description: peers 让运行在不同主机上的 Claude Code 会话互相发现，并交换文本消息。
      images:
        - images/social-card-zh.png
      llms:
        documentation: 文档
        additional: 更多文档
        more: 更多
        full: 全部文档合在一个纯文本文件里。
        repository: GitHub 上的 peers
    menus:
      main:
        - name: 文档
          pageRef: /docs
          weight: 1
        - name: 搜索
          weight: 2
          params:
            type: search
        - name: 语言
          weight: 3
          params:
            type: language-switch
        - name: GitHub
          weight: 4
          url: https://github.com/wangzw/peers
          params:
            icon: github
