# Test double for the latest-copy class of the fictional deployment in this
# directory: v0.6.2 at /v0.6.2/, with dev unreleased and v0.6.1 the older
# published release. docs/site/testdata is outside every Hugo mount, so an
# ordinary build never reads this file; name it after docs/site/hugo.yaml:
#
#   hugo --source docs/site \
#     --config hugo.yaml,testdata/version-classes/latest-copy.yaml
#
# Paths in --config resolve against --source.
#
# This build carries no sitemap or robots.txt, and restates the kinds
# docs/site/hugo.yaml disables because a later list replaces the earlier one.
baseURL: https://peers.zhanwei.wang/v0.6.2/
disableKinds:
  - sitemap
  - robotstxt
  - taxonomy
  - term
params:
  release: "0.6.2"
  version:
    name: v0.6.2
    class: latest-copy
    canonicalBaseURL: https://peers.zhanwei.wang/
    latestBaseURL: https://peers.zhanwei.wang/
    latestName: v0.6.2
  versions:
    - name: dev
      url: https://peers.zhanwei.wang/dev/
      class: dev
    - name: v0.6.2
      url: https://peers.zhanwei.wang/
      class: latest
    - name: v0.6.1
      url: https://peers.zhanwei.wang/v0.6.1/
      class: older
