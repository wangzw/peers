# Test double for the dev class of the fictional deployment in this
# directory: the unreleased tree at /dev/, with v0.6.2 the latest published
# release and v0.6.1 the older one. docs/site/testdata is outside every Hugo
# mount, so an ordinary build never reads this file; name it after
# docs/site/hugo.yaml:
#
#   hugo --source docs/site \
#     --config hugo.yaml,testdata/version-classes/dev.yaml
#
# Paths in --config resolve against --source.
#
# This build carries no sitemap or robots.txt, and restates the kinds
# docs/site/hugo.yaml disables because a later list replaces the earlier one.
# Its install commands fetch the latest released binaries, hence release 0.6.2.
baseURL: https://peers.zhanwei.wang/dev/
disableKinds:
  - sitemap
  - robotstxt
  - taxonomy
  - term
params:
  release: "0.6.2"
  version:
    name: dev
    class: dev
    canonicalBaseURL: ""
    latestBaseURL: https://peers.zhanwei.wang/
    latestName: v0.6.2
  versions:
    - name: dev
      url: https://peers.zhanwei.wang/dev/
      class: dev
    - name: v0.6.2
      url: https://peers.zhanwei.wang/
      class: latest
    - name: v0.6.1
      url: https://peers.zhanwei.wang/v0.6.1/
      class: older
