name: peers-rs

services:
  hosta:
    image: debian:bookworm-slim
    hostname: hosta
    init: true
    command: ["sleep", "infinity"]
    volumes:
      - "${RS_ROOT:?RS_ROOT must point at the rsprobe environment root}/bin/peers:/usr/local/bin/peers:ro"
      - "${RS_ROOT:?RS_ROOT must point at the rsprobe environment root}/bin/rsprobe:/usr/local/bin/rsprobe:ro"
      - "./hosta-init.sh:/hosta-init.sh:ro"
