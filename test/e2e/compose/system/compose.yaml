# Every service, network and volume carries the owner label; harness.CleanResidue
# removes only resources whose owner is gone.
services:
  plain:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    init: true
    user: root
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    # The no-egress check installs an OUTPUT DROP rule inside this container, so
    # it needs NET_ADMIN and NET_RAW; only this container's netns is changed.
    cap_add: [NET_ADMIN, NET_RAW]
    entrypoint: []
    command: ["sleep", "infinity"]
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
    networks:
      - system
  # The systemd service Run starts and the first host of a pair; the other host
  # dials it as hostA.
  systemd:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    privileged: true
    cgroup: host
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    tmpfs:
      - /run
      - /run/lock
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # The two hosts of a pair exchange pairing files and completion markers
      # here. A named volume is mounted at the same path in both services.
      - pair-shared:/shared
    networks:
      system:
        aliases:
          - hostA
  # The second host of a pair, equal to hostA so either side can run a system or
  # user Broker; only syscontainer.RunPairTest starts it.
  hostB:
    image: ${PEERS_E2E_SYSTEM_IMAGE:?}
    privileged: true
    cgroup: host
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    tmpfs:
      - /run
      - /run/lock
    environment:
      PEERS_E2E_IN_CONTAINER: "1"
    volumes:
      - ${PEERS_E2E_BIN:?}:/opt/peers-test:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - pair-shared:/shared
    networks:
      system:
        aliases:
          - hostB

volumes:
  pair-shared:
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}

networks:
  # Internal network with a subnet in the high-end block of 198.18.0.0/15 that
  # the harness routed allocator reserves, so the two allocators never overlap.
  # syscontainer.Run overrides the subnet per project because Docker refuses two
  # live overlapping networks; the default serves a manual compose invocation.
  system:
    internal: true
    labels:
      peers.e2e.owner: ${PEERS_E2E_OWNER:?}
    ipam:
      config:
        - subnet: ${PEERS_E2E_SYSTEM_SUBNET:-198.19.240.0/24}
