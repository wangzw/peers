# Docker allocates the IPv4 subnets and the test passes a random ULA prefix for
# each IPv6 subnet; no IPv6 default route is set, so the harness adds one.
services:
  hostA:
    image: ${E2E_IMAGE}
    hostname: ${HOSTA_NAME:-hostA}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTA}:/ctl"]
    networks: [net]

  hostB:
    image: ${E2E_IMAGE}
    hostname: ${HOSTB_NAME:-hostB}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTB}:/ctl"]
    networks: [net, virt]

networks:
  net:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${V6_NET}
  virt:
    internal: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${V6_VIRT}
