# The harness adds the REDIRECT rule on the router and starts the relay on the
# router's port 17443.
services:
  hostA:
    image: ${E2E_IMAGE}
    hostname: ${HOSTA_NAME:-hostA}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTA}:/ctl"]
    networks: [wan, wan2]

  router:
    image: ${E2E_IMAGE}
    hostname: ${ROUTER_NAME:-router}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_ROUTER}:/ctl"]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks: [wan, wan2, lanb]

  hostB:
    image: ${E2E_IMAGE}
    hostname: ${HOSTB_NAME:-hostB}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTB}:/ctl"]
    networks: [lanb]

# Routed gateway mode lets the router forward between networks on Docker 29;
# the subnets are pinned inside 198.18.0.0/15 so a bridge route never captures
# this k8s node's own networks, and the harness overrides them per project.
networks:
  wan:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${MITM_WAN_SUBNET:-198.18.5.0/24}
  wan2:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${MITM_WAN2_SUBNET:-198.18.6.0/24}
  lanb:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${MITM_LANB_SUBNET:-198.18.7.0/24}
