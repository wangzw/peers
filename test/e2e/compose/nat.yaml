# The router masquerades lanb traffic and forwards it; routes and firewall rules
# are installed by the harness after up, not here.
services:
  hostA:
    image: ${E2E_IMAGE}
    hostname: ${HOSTA_NAME:-hostA}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTA}:/ctl"]
    networks: [wan, wan2]

  router:
    image: ${E2E_IMAGE}
    hostname: ${ROUTER_NAME:-router}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_ROUTER}:/ctl"]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
    networks: [wan, wan2, lanb]

  hostB:
    image: ${E2E_IMAGE}
    hostname: ${HOSTB_NAME:-hostB}
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${CTL_HOSTB}:/ctl"]
    networks: [lanb]

# Routed gateway mode lets the router forward between networks on Docker 29.
# The networks cannot be internal: Docker 29 drops routed traffic that crosses
# an internal bridge before the router sees it. Every subnet is pinned inside
# 198.18.0.0/15 so a bridge route never captures this k8s node's own networks,
# and the harness overrides them per project.
networks:
  wan:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${NAT_WAN_SUBNET:-198.18.0.0/24}
  wan2:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${NAT_WAN2_SUBNET:-198.18.1.0/24}
  lanb:
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: routed
    ipam:
      config:
        - subnet: ${NAT_LANB_SUBNET:-198.18.2.0/24}
